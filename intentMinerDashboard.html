<!DOCTYPE html>
<html>
<head>
  <title>Intent Miner Tool</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 15px 20px;
      font-size: 18px;
    }

    .container {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    textarea {
      width: 100%;
      height: 160px;
      font-family: monospace;
      border-radius: 6px;
      border: 1px solid #ccc;
      padding: 10px;
    }

    button {
      padding: 10px 15px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .primary { background: #2563eb; color: white; }
    .success { background: #16a34a; color: white; }
    .secondary { background: #e5e7eb; }
    .danger { background: #dc2626; color: white; }

    .drop-zone {
      border: 2px dashed #9ca3af;
      padding: 25px;
      text-align: center;
      border-radius: 8px;
      color: #6b7280;
    }

    .stats {
      display: flex;
      gap: 20px;
      font-weight: bold;
      align-items: center;
    }

    .preview {
      height: 250px;
    }

    .row {
      margin-top: 10px;
    }

    .warnings-box {
      display: none;
      white-space: pre-wrap;
      font-family: monospace;
      max-height: 200px;
      overflow-y: auto;
      background: #fff7ed;
      border: 1px solid #fdba74;
    }
  </style>
</head>

<body>

<header>
  Intent Miner JSON Generator
</header>

<div class="container">

  <div class="card">
    <div class="drop-zone" id="dropZone">
      Drag & drop CSV/TXT here or
      <br><br>
      <input type="file" id="fileInput">
    </div>
    <p id="fileInfo"></p>

    <div class="row">
      <button class="danger" onclick="clearFile()">Clear File</button>
    </div>
  </div>

  <div class="card">
    <h3>Paste Utterances</h3>
    <textarea id="inputText" placeholder="One utterance per line..."></textarea>

    <div class="row">
      <button class="danger" onclick="clearInput()">Clear Paste</button>
    </div>
  </div>

  <div class="card stats">
    <div id="count">Conversations: 0</div>
    <div id="warnings">Warnings: 0</div>
    <button class="secondary" onclick="toggleWarnings()">View Warnings</button>
  </div>

  <div class="card warnings-box" id="warningsBox"></div>

  <div class="card">
    <button class="secondary" onclick="previewJSON()">Preview</button>
    <button class="success" onclick="generateJSON()">Generate JSON</button>
    <button class="danger" onclick="clearPreview()">Clear Preview</button>
  </div>

  <div class="card">
    <h3>Preview</h3>
    <textarea id="preview" class="preview"></textarea>
  </div>

</div>

<script>
const MAX_CONVERSATIONS = 30000;
const MAX_TRANSCRIPT = 500;
const MAX_ID_LENGTH = 100;

let conversations = [];
let warnings = 0;
let warningMessages = [];

// ---------- CLEAR ----------
function clearInput() {
  document.getElementById("inputText").value = "";
  conversations = [];
  updateStats();
}

function clearPreview() {
  document.getElementById("preview").value = "";
}

function clearFile() {
  document.getElementById("fileInput").value = "";
  document.getElementById("fileInfo").innerText = "";
  conversations = [];
  updateStats();
}

// ---------- CSV ----------
function parseCSV(text) {
  const lines = text.split("\n");
  const headers = lines[0].split(",");

  function get(row, names) {
    for (let n of names) {
      let idx = headers.findIndex(h => h.toLowerCase().trim() === n);
      if (idx !== -1) return row[idx];
    }
    return "";
  }

  let map = {};
  warnings = 0;
  warningMessages = [];

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i]) continue;

    let row = lines[i].split(",");

    let id = get(row, ["conversation_id","conversation id","id"]) || "id_"+i;

    if (id.length > MAX_ID_LENGTH) {
      warningMessages.push(`Row ${i}: ID truncated`);
      warnings++;
      id = id.substring(0, MAX_ID_LENGTH);
    }

    let textVal = get(row, ["transcript","utterance","text","message","body","segment text"]);
    if (!textVal) continue;

    if (textVal.length > MAX_TRANSCRIPT) {
      warningMessages.push(`Row ${i}: Transcript truncated`);
      warnings++;
      textVal = textVal.substring(0, MAX_TRANSCRIPT);
    }

    if (!map[id]) map[id] = [];

    map[id].push({
      participant: "customer",
      transcript: textVal
    });
  }

  return Object.keys(map).map(id => ({
    id: id,
    turns: map[id]
  }));
}

// ---------- TEXT ----------
function parseText(text) {
  warnings = 0;
  warningMessages = [];

  return text.split("\n")
    .filter(x => x.trim())
    .map((t,i) => {

      let id = "id_"+(i+1);

      if (id.length > MAX_ID_LENGTH) {
        warningMessages.push(`Line ${i+1}: ID truncated`);
        warnings++;
        id = id.substring(0, MAX_ID_LENGTH);
      }

      if (t.length > MAX_TRANSCRIPT) {
        warningMessages.push(`Line ${i+1}: Transcript truncated`);
        warnings++;
      }

      return {
        id: id,
        turns: [{
          participant: "customer",
          transcript: t.substring(0, MAX_TRANSCRIPT)
        }]
      };
    });
}

// ---------- WARNINGS UI ----------
function toggleWarnings() {
  const box = document.getElementById("warningsBox");

  if (box.style.display === "none") {
    box.style.display = "block";
    box.innerText = warningMessages.length
      ? warningMessages.join("\n")
      : "No warnings 🎉";
  } else {
    box.style.display = "none";
  }
}

// ---------- STATS ----------
function updateStats() {
  document.getElementById("count").innerText =
    "Conversations: " + conversations.length;

  document.getElementById("warnings").innerText =
    "Warnings: " + warnings;
}

// ---------- FILE ----------
function handleFile(file) {
  const reader = new FileReader();

  reader.onload = function(e) {
    const text = e.target.result;

    conversations = file.name.endsWith(".csv")
      ? parseCSV(text)
      : parseText(text);

    document.getElementById("fileInfo").innerText = "Loaded: " + file.name;
    updateStats();
  };

  reader.readAsText(file);
}

document.getElementById("fileInput").addEventListener("change", e => {
  handleFile(e.target.files[0]);
});

// ---------- PREVIEW ----------
function previewJSON() {
  if (conversations.length === 0) {
    conversations = parseText(document.getElementById("inputText").value);
  }

  document.getElementById("preview").value =
    JSON.stringify({
      locale: "en-us",
      conversations: conversations
    }, null, 2);

  updateStats();
}

// ---------- DOWNLOAD ----------
function download(data, name) {
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
}

// ---------- GENERATE ----------
function generateJSON() {
  if (conversations.length === 0) {
    conversations = parseText(document.getElementById("inputText").value);
  }

  if (conversations.length === 0) {
    alert("No data found");
    return;
  }

  download({
    locale:"en-us",
    conversations: conversations
  }, "intent.json");
}
</script>

</body>
</html>
